<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GRACEFUL17 Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="elastic-list.css">
</head>

<body>
  <main>
    <header>
      <h1>Ontology Classes</h1>
      <h2 id="class-label" class="resource-label"></h2>
      <p id="class-uri"></p>
    </header>

    <section id="comment-box" class="comment-box" hidden>
      <div id="comment-text"></div>
    </section>

    <section id="elastic-section">
      <h3>Browse Data</h3>
      <div class="row" id="elastic-list"></div>
      <div class="elastic-toolbar">
        <button id="elastic-reset" type="button">Reset Filters</button>
        <span id="elastic-result-count" class="elastic-result-count"></span>
        <div class="elastic-pagination">
          <button id="elastic-prev" type="button" disabled>Previous</button>
          <span id="elastic-page-info"></span>
          <button id="elastic-next" type="button" disabled>Next</button>
        </div>
      </div>
      <div id="elastic-results" class="container mt-4">
        <div id="elastic-results-row" class="row"></div>
      </div>
      <hr>
    </section>

    <section id="status" class="status">Loading Classes …</section>

    <section id="content" hidden>
      <div class="layout">
        <nav class="class-nav" aria-label="Class hierarchy">
          <h4>Classes</h4>
          <ul id="class-tree"></ul>
        </nav>

        <section class="class-content">
          
        <details open>
          <summary>Instances</summary>

          <div class="table-toolbar">
            <input
              id="instance-search"
              type="search"
              placeholder="Search instances..."
            >

            <span id="instance-count"></span>

            <div class="pagination">
              <button id="prev-page" type="button">Previous</button>
              <span id="page-info"></span>
              <button id="next-page" type="button">Next</button>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Instance</th>
                <th>URI</th>
              </tr>
            </thead>
            <tbody id="instances"></tbody>
          </table>
        </details>
        </section>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="elastic-list.js"></script>
  <script src="classes.js"></script>
</body>
</html>
